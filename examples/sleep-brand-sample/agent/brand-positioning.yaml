brand: CLIENT_NAME
one_liner: Better sleep, without the noise.
who_we_are: >
  CLIENT_NAME makes simple sleep tools for people who are tired of being
  optimized. We sell products and guidance that help nights feel
  quieter and mornings feel possible.
who_its_for: >
  Adults 28-45 who are high-functioning during the day and
  overstimulated at night. They have tried the apps, the hacks,
  and the supplements. They want something calmer and more honest.
category: Sleep products and evening routines
problem: >
  Sleep advice is either medical and cold, or influencer-soft and
  untrustworthy. People do not need another tracker. They need
  fewer inputs.
difference: >
  CLIENT_NAME is specific, unhurried, and material. We talk like a
  good friend who has actually been awake at 2am. We design
  objects and words that reduce stimulation instead of adding
  another system.
proof_points:
  - One core ritual, not a 12-step protocol
  - Ingredients and materials listed in plain language
  - No sleep-score theater
do_not_compete_with:
  - biohacking brands
  - luxury spa theatrics
  - clinical hospital brands
