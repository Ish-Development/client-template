<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitemap</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; background: #fff; color: #000; font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .topbar { position: sticky; top: 0; z-index: 10; background: #fff; border-bottom: 1px solid #e5e5e5; padding: 14px 32px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .logo { font-weight: 600; white-space: nowrap; }
  .logo span { font-weight: 400; color: #666; }
  .tabs { display: flex; gap: 16px; flex-wrap: wrap; }
  .tab { font-size: 13px; color: #666; white-space: nowrap; }
  .tab:hover { color: #000; text-decoration: none; }
  .tab.active { color: #000; font-weight: 500; }
  .content { padding: 48px 32px; max-width: 880px; }
  .panel { display: none; }
  .panel.active { display: block; }
  h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .meta { color: #666; font-size: 13px; margin-bottom: 40px; }
  .label { font-size: 12px; color: #666; margin-bottom: 4px; }
  .goal { margin-bottom: 40px; }
  .goal .meta { margin: 0; }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 40px; }
  .grid { display: grid; gap: 40px; }
  .group-title { font-size: 12px; color: #666; padding-bottom: 8px; border-bottom: 1px solid #e5e5e5; }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; flex-wrap: wrap; }
  .branch { font-family: ui-monospace, Menlo, monospace; color: #bbb; font-size: 12px; }
  .path { font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .name { color: #666; }
  .tag { font-size: 11px; color: #000; padding: 0 6px; border: 1px solid #d4d4d4; border-radius: 4px; line-height: 18px; text-transform: capitalize; }
  .tag.converter { background: #000; color: #fff; border-color: #000; }
  .tag.later { border-style: dashed; color: #666; }
  .page-head .meta { font-family: ui-monospace, Menlo, monospace; }
  .facts { margin-bottom: 40px; border-top: 1px solid #e5e5e5; }
  .fact { display: grid; grid-template-columns: 160px 1fr; gap: 16px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; }
  .fact .label { margin: 0; }
  .wire { display: flex; flex-direction: column; gap: 8px; }
  .section { position: relative; background: #f7f7f7; border: 1px solid #e5e5e5; border-radius: 6px; padding: 16px 18px; min-height: 96px; }
  .section.s { min-height: 56px; }
  .section.l { min-height: 220px; }
  .sections-label { padding-bottom: 8px; margin-bottom: 8px; }
  .num { position: absolute; top: 16px; right: 18px; color: #999; font-size: 12px; }
  .section-title { font-weight: 500; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-right: 32px; }
  .section-note { color: #444; margin-top: 4px; max-width: 60ch; }
  .section-copy { color: #000; margin-top: 10px; max-width: 60ch; white-space: pre-line; font-size: 15px; }
  .section.has-copy .section-note { color: #999; font-size: 12px; }
  .back { display: inline-block; margin-bottom: 24px; font-size: 13px; color: #666; }
  .sub { margin-top: 40px; }
  @media (max-width: 600px) { .content { padding: 32px 16px; } .topbar { padding: 12px 16px; } .fact { grid-template-columns: 1fr; gap: 0; } }
  @media print { .topbar { position: static; } .panel { display: block !important; page-break-after: always; } }
</style>
</head>
<body>
<div class="topbar"><div class="logo" id="logo"></div><nav class="tabs" id="tabs"></nav></div>
<main class="content" id="content"></main>

<script>
/* DATA: Claude fills this from agent/site-plan.yaml. Only edit this block. */
window.SITE = {
  client: "CLIENT_NAME",
  date: "YYYY-MM-DD",
  version: "v1",
  goal: { primary: "", secondary: "" },
  groups: [
    { title: "Main navigation", pages: ["home"] }
  ],
  pages: [
    {
      id: "home", name: "Home", url: "/", parent: null,
      job: "converter", next_action: "", measured_by: "",
      journey_stage: "", search_question: "", phase: 1, copy_doc: "",
      sections: [ { name: "Hero", job: "attractor", size: "l", note: "", copy: "" } ]
    }
  ]
};
/* END DATA */

(function () {
  var S = window.SITE;
  var byId = {}; S.pages.forEach(function (p) { byId[p.id] = p; });
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function tag(job, later) {
    var t = el('span', 'tag ' + (job || '').toLowerCase() + (later ? ' later' : ''), later ? 'later' : job);
    return t;
  }
  document.title = S.client + ' sitemap';
  var logo = document.getElementById('logo');
  logo.textContent = S.client + ' ';
  logo.appendChild(el('span', null, '/ Sitemap ' + (S.version || '')));

  var tabs = document.getElementById('tabs');
  var content = document.getElementById('content');

  function addTab(id, label) { var a = el('a', 'tab', label); a.href = '#' + id; a.dataset.id = id; tabs.appendChild(a); }

  // Overview
  addTab('overview', 'Information architecture');
  var ov = el('section', 'panel'); ov.id = 'panel-overview';
  ov.appendChild(el('h1', null, 'Information architecture'));
  ov.appendChild(el('div', 'meta', S.client + ' · ' + S.date + ' · ' + S.pages.length + ' pages'));
  var goal = el('div', 'goal');
  goal.appendChild(el('div', 'label', 'Site goal'));
  goal.appendChild(el('div', null, S.goal.primary || '—'));
  if (S.goal.secondary) goal.appendChild(el('div', 'meta', 'Secondary: ' + S.goal.secondary));
  ov.appendChild(goal);
  var legend = el('div', 'legend');
  ['converter', 'collector', 'attractor', 'informer'].forEach(function (j) { legend.appendChild(tag(j)); });
  legend.appendChild(tag('', true));
  ov.appendChild(legend);

  var grid = el('div', 'grid');
  S.groups.forEach(function (g) {
    var box = el('div', 'group');
    box.appendChild(el('div', 'group-title', g.title));
    function row(p, depth, last) {
      var r = el('div', 'row');
      r.style.paddingLeft = (depth * 22) + 'px';
      r.appendChild(el('span', 'branch', last ? '└─' : '├─'));
      var a = el('a', 'path', p.url); a.href = '#page-' + p.id; r.appendChild(a);
      r.appendChild(el('span', 'name', p.name));
      if (p.job) r.appendChild(tag(p.job));
      if (p.phase && p.phase > 1) r.appendChild(tag('', true));
      box.appendChild(r);
      var kids = S.pages.filter(function (k) { return k.parent === p.id; });
      kids.forEach(function (k, i) { row(k, depth + 1, i === kids.length - 1); });
    }
    g.pages.forEach(function (id, i) { if (byId[id]) row(byId[id], 0, i === g.pages.length - 1); });
    grid.appendChild(box);
  });
  ov.appendChild(grid);
  content.appendChild(ov);

  // One panel per page
  S.pages.forEach(function (p) {
    addTab('page-' + p.id, p.name);
    var pn = el('section', 'panel'); pn.id = 'panel-page-' + p.id;
    var back = el('a', 'back', '← Information architecture'); back.href = '#overview'; pn.appendChild(back);
    var head = el('div', 'page-head');
    var h = el('h1', null, p.name + ' '); if (p.job) h.appendChild(tag(p.job)); if (p.phase && p.phase > 1) h.appendChild(tag('', true));
    head.appendChild(h);
    head.appendChild(el('div', 'meta', p.url));
    pn.appendChild(head);
    var facts = el('div', 'facts');
    [['Next action', p.next_action], ['Measured by', p.measured_by], ['Journey stage', p.journey_stage], ['Search question', p.search_question]]
      .forEach(function (f) { var d = el('div', 'fact'); d.appendChild(el('div', 'label', f[0])); d.appendChild(el('div', null, f[1] || '—')); facts.appendChild(d); });
    if (p.copy_doc) { var d = el('div', 'fact'); d.appendChild(el('div', 'label', 'Copy doc')); var a = el('a', null, 'Open the Google Doc for this page'); a.href = p.copy_doc; a.target = '_blank'; a.style.textDecoration = 'underline'; var v = el('div'); v.appendChild(a); d.appendChild(v); facts.appendChild(d); }
    pn.appendChild(facts);
    pn.appendChild(el('div', 'label sections-label', 'Wireframe'));
    var wire = el('div', 'wire');
    (p.sections || []).forEach(function (s, i) {
      var box = el('div', 'section ' + (s.size || 'm') + (s.copy ? ' has-copy' : ''));
      box.appendChild(el('div', 'num', String(i + 1)));
      var t = el('div', 'section-title', s.name + ' '); if (s.job) t.appendChild(tag(s.job));
      box.appendChild(t);
      if (s.note) box.appendChild(el('div', 'section-note', s.note));
      if (s.copy) box.appendChild(el('div', 'section-copy', s.copy));
      wire.appendChild(box);
    });
    pn.appendChild(wire);
    var kids = S.pages.filter(function (k) { return k.parent === p.id; });
    if (kids.length) {
      pn.appendChild(el('div', 'label sections-label sub', 'Pages below this one'));
      kids.forEach(function (k) { var a = el('a', 'path', k.url + ' · ' + k.name); a.href = '#page-' + k.id; var r = el('div', 'row'); r.appendChild(a); pn.appendChild(r); });
    }
    content.appendChild(pn);
  });

  function show() {
    var id = (location.hash || '#overview').slice(1);
    if (!document.getElementById('panel-' + id)) id = 'overview';
    document.querySelectorAll('.panel').forEach(function (x) { x.classList.toggle('active', x.id === 'panel-' + id); });
    document.querySelectorAll('.tab').forEach(function (x) { x.classList.toggle('active', x.dataset.id === id); });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
